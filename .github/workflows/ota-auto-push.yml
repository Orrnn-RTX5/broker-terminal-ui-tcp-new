name: Pure Binary TCP OTA Auto-Push (:9100) & Multi-Platform Releases

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rtx5-ota-push-Broker-Terminal-UI-TCP
  cancel-in-progress: true

jobs:
  ota-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build UI Bundle & Auto-Push Signed OTA over :9100 Binary TCP
        env:
          CGO_ENABLED: '0'
          RTX5_MASTER_PRIV_HEX: ${{ secrets.RTX5_MASTER_PRIV_HEX }}
        run: |
          VER=$(tr -d '\r\n ' < VERSION)
          export VITE_APP_VERSION="$VER"
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build
          cd scripts/ota-packager
          go run . -ci-app terminal -ci-dist ../../dist -version "$VER" -push-tcp "51.195.188.172:9100"

      - name: Build Windows .exe & Setup Installer
        run: |
          VER=$(tr -d '\r\n ' < VERSION)
          mkdir -p release-assets
          rm -rf desktop-clients/cmd/rtx5-terminal-client/dist/*
          cp -r dist/. desktop-clients/cmd/rtx5-terminal-client/dist/
          cd desktop-clients
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H=windowsgui" -o /tmp/RTX5-Terminal64.exe ./cmd/rtx5-terminal-client
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H=windowsgui" -o /tmp/rtx5-setup-base.exe ./cmd/rtx5-setup-installer
          go run ./cmd/pack-setup-installer \
            -base /tmp/rtx5-setup-base.exe \
            -out ../release-assets/RTX5-Terminal-Setup64.exe \
            -id RTX5-Terminal \
            -title "RTX5 Trader Terminal (64-Bit)" \
            -version "$VER" \
            -folder "Trader Terminal" \
            -main-exe RTX5-Terminal64.exe \
            -shortcut "RTX5 Trader Terminal" \
            -server-tcp "51.195.188.172:4443" \
            -superadmin-tcp "51.195.188.172:9100" \
            -files "/tmp/RTX5-Terminal64.exe,clientcore/rtx5_guard.dll,clientcore/authority-pub.json,assets/rtx5.ico"

      - name: Build Linux Native Client (.deb & .tar.gz)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          VER=$(tr -d '\r\n ' < VERSION)
          mkdir -p release-assets /tmp/deb-pkg/DEBIAN /tmp/deb-pkg/usr/local/bin /tmp/deb-pkg/usr/share/applications
          cd desktop-clients
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/deb-pkg/usr/local/bin/rtx5-terminal ./cmd/rtx5-terminal-client
          chmod 755 /tmp/deb-pkg/usr/local/bin/rtx5-terminal
          cd ..
          tar -czf "release-assets/RTX5-Terminal-${VER}-linux-amd64.tar.gz" -C /tmp/deb-pkg/usr/local/bin rtx5-terminal
          cat > /tmp/deb-pkg/DEBIAN/control <<EOF
          Package: rtx5-terminal
          Version: ${VER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Maintainer: RTX5 <support@rtx5.local>
          Description: RTX5 Trader Terminal (Encrypted Binary TCP)
          EOF
          cat > /tmp/deb-pkg/usr/share/applications/rtx5-terminal.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=RTX5 Trader Terminal
          Exec=/usr/local/bin/rtx5-terminal
          Terminal=false
          Categories=Office;Finance;
          EOF
          dpkg-deb --build /tmp/deb-pkg "release-assets/RTX5-Terminal-${VER}-linux-amd64.deb"

      - name: Publish GitHub Release (Windows & Linux Assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(tr -d '\r\n ' < VERSION)
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "$TAG" --notes "RTX5 Trader Terminal $TAG (Encrypted Binary TCP)"
          fi

  macos-release:
    needs: ota-push
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build macOS .dmg (arm64 & x64)
        run: |
          VER=$(tr -d '\r\n ' < VERSION)
          export VITE_APP_VERSION="$VER"
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build
          mkdir -p release-assets
          rm -rf desktop-clients/cmd/rtx5-terminal-client/dist/*
          cp -r dist/. desktop-clients/cmd/rtx5-terminal-client/dist/
          cd desktop-clients
          for ARCH in arm64 amd64; do
            OUT_ARCH="$ARCH"
            if [ "$ARCH" = "amd64" ]; then OUT_ARCH="x64"; fi
            STAGE="/tmp/macos-$ARCH"
            APP="$STAGE/RTX5 Trader Terminal.app"
            rm -rf "$STAGE"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            CGO_ENABLED=1 GOOS=darwin GOARCH="$ARCH" go build -trimpath -ldflags="-s -w" -o "$APP/Contents/MacOS/rtx5-terminal" ./cmd/rtx5-terminal-client
            cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>rtx5-terminal</string>
            <key>CFBundleIdentifier</key><string>com.rtx5.terminal</string>
            <key>CFBundleName</key><string>RTX5 Trader Terminal</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
            ln -s /Applications "$STAGE/Applications"
            hdiutil create -volname "RTX5 Trader Terminal ${VER}" -srcfolder "$STAGE" -ov -format UDZO "../release-assets/RTX5-Terminal-${VER}-${OUT_ARCH}.dmg"
          done

      - name: Upload macOS .dmg Assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(tr -d '\r\n ' < VERSION)
          TAG="v$VER"
          gh release upload "$TAG" release-assets/*.dmg --clobber
